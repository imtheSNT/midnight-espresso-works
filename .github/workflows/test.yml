name: Tests

# The suite takes a while — it drives the real kit through real pointer events.
# Running it here means nobody has to remember to run it before pushing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    name: Playwright ${{ matrix.shard }}/3
    # EXPERIMENT ON THIS BRANCH ONLY: 26.04, to find out whether the thing
    # main is pinned away from actually works. main stays on 24.04 until this
    # says yes. The reasoning below is why the pin exists at all.
    #
    # Pinned, not latest, and deliberately. GitHub moves `ubuntu-latest` to
    # 26.04 gradually between 19 Oct and 19 Nov 2026, which means runs land on
    # one image or the other at random: the same commit green once and red the
    # next time, which is the worst failure a suite can have.
    #
    # It would be red rather than flaky here. Playwright resolves an unknown
    # Ubuntu to "ubuntu26.04-x64" (hostPlatform.js draws its line at
    # `major < 26`), and 1.56 has no entry for it: `--with-deps` prints
    # "Cannot install dependencies" and installs nothing, and the Chromium
    # download table has no row for it either, so there is no browser to fetch.
    #
    # Unpinning needs Playwright >= 1.61, the first release that knows
    # ubuntu26.04 -- and that brings a new bundled Chromium, so every pixel and
    # millisecond figure in the README has to be re-measured first. Until then
    # this is what keeps "results are the same on every machine" true.
    runs-on: ubuntu-26.04
    # A shard is a third of the suite, so about twelve minutes plus three to
    # install. Thirty is headroom, not a target; if a shard ever gets near it,
    # the answer is another shard, not a bigger number.
    timeout-minutes: 30

    strategy:
      # One shard going red must not cancel the others. The point of running
      # the whole suite is to see everything that is broken, not the first
      # thing.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 24 because that is what the actions themselves now run on, and
          # because 20 is past end of life. Playwright 1.56 asks for >=18.
          node-version: 24

      # package-lock.json is gitignored, so this is `npm install`, not `npm ci`
      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Software rendering, same as the README describes, so a failure here
      # means the same thing it means on your machine. Each shard still runs
      # its own third one test at a time (workers: 1), so a shard behaves
      # exactly like a short local run.
      - name: Run tests
        run: npx playwright test --shard=${{ matrix.shard }}/3
        env:
          CI: "true"

      # A blob report is the shard's results in a form that can be merged with
      # the others. On its own it is not readable; the report job below turns
      # the three of them into one HTML report.
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

      # Traces are only written for failures; they are the quickest way to see
      # what the kit was actually doing when a test went red. Named per shard
      # because upload-artifact has refused two artifacts with the same name
      # since v4.
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

  report:
    name: Report
    needs: [playwright]
    # Runs even when a shard failed — a red run is when you most want the
    # report.
    if: ${{ !cancelled() }}
    # Pinned to match the shards. This one only merges blob reports and needs
    # no browser, so it would survive 26.04 — but a report job on a different
    # image from the tests it is reporting on is a confusion waiting to happen.
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 24 because that is what the actions themselves now run on, and
          # because 20 is past end of life. Playwright 1.56 asks for >=18.
          node-version: 24

      # merge-reports ships with Playwright, so the package is all this needs —
      # no browser.
      - name: Install dependencies
        run: npm install

      # If every shard was killed by its own timeout, none of them uploaded a
      # blob report and this step fails with nothing found. That is a red job
      # on top of three red shards, which is noisy but not misleading — read
      # the shards, not this.
      - name: Download blob reports
        uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into one report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
