name: Tests

# The suite takes a while — it drives the real kit through real pointer events.
# Running it here means nobody has to remember to run it before pushing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # package-lock.json is gitignored, so this is `npm install`, not `npm ci`
      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Software rendering, same as the README describes, so a failure here
      # means the same thing it means on your machine.
      - name: Run tests
        run: npx playwright test
        env:
          CI: "true"

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # Traces are only written for failures; they are the quickest way to see
      # what the kit was actually doing when a test went red.
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14
